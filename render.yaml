services:
  - type: web
    name: comet-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @workspace/api-server run build
    startCommand: |
      pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://your-project-name.vercel.app
      - key: CORS_ORIGIN
        value: https://your-project-name.vercel.app
